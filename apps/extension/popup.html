<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Registrar en la Torre</title>
    <style>
      /* Mismos colores que la aplicación: al abrirla no parece otra cosa. */
      :root {
        --paper: #f5f1ea;
        --surface: #fffcf7;
        --line: #e4dccf;
        --ink: #1c1a17;
        --ink-2: #57514a;
        --ink-3: #8b8377;
        --command: #1f4a5f;
        --command-hover: #173b4c;
        --ok: #2c6e5b;
        --ok-bg: #e3efea;
        --warn: #a6521a;
        --warn-bg: #f8eadd;
        --fail: #a33a2e;
        --fail-bg: #f7e4e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: var(--paper);
        color: var(--ink);
        font: 13px/1.45 system-ui, 'Segoe UI', sans-serif;
      }

      .titulo {
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .ficha {
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .ficha__titulo {
        margin: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .ficha__sitio {
        margin: 4px 0 0;
        font-size: 11.5px;
        color: var(--ink-3);
        overflow-wrap: anywhere;
      }

      .plataforma {
        display: inline-block;
        margin-top: 8px;
        padding: 1px 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 11px;
        color: var(--ink-2);
      }

      button {
        width: 100%;
        margin-top: 10px;
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--command);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--command-hover);
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .aviso {
        margin-top: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        font-size: 12px;
      }

      .aviso[data-tono='ok'] {
        background: var(--ok-bg);
        color: var(--ok);
      }

      .aviso[data-tono='atencion'] {
        background: var(--warn-bg);
        color: var(--warn);
      }

      .aviso[data-tono='fallo'] {
        background: var(--fail-bg);
        color: var(--fail);
      }

      .deteccion {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .deteccion__linea {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 600;
        font-size: 12.5px;
      }

      .deteccion__punto {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--ink-3);
        flex: none;
      }

      .deteccion__punto[data-activa='true'] {
        background: var(--ok);
      }

      .deteccion__nota {
        margin: 6px 0 0;
        font-size: 11px;
        line-height: 1.5;
        color: var(--ink-3);
      }

      .btn-suave {
        width: 100%;
        margin-top: 8px;
        padding: 7px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: transparent;
        color: var(--command);
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-suave:hover {
        background: var(--paper);
      }

      /* Segunda línea del aviso: matiza sin gritar. */
      .aviso__nota {
        display: block;
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid currentColor;
        opacity: 0.85;
        font-size: 11.5px;
      }

      .promesa {
        margin: 12px 0 0;
        font-size: 11px;
        line-height: 1.5;
        color: var(--ink-3);
      }

      a {
        color: var(--command);
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <p class="titulo">AI Torre de Control</p>

    <div class="ficha">
      <p class="ficha__titulo" id="titulo">Leyendo la pestaña…</p>
      <p class="ficha__sitio" id="sitio"></p>
      <span class="plataforma" id="plataforma" hidden></span>
    </div>

    <button id="registrar" disabled>Registrar en la Torre</button>

    <div class="aviso" id="aviso" hidden></div>

    <!--
      Etapa 2. Aparece solo en los sitios donde la detección es posible.
      El permiso lo concedes tú aquí, y puedes retirarlo desde este mismo botón.
    -->
    <div class="deteccion" id="deteccion" hidden>
      <div class="deteccion__linea">
        <span class="deteccion__punto" id="deteccion-punto"></span>
        <span id="deteccion-estado"></span>
      </div>
      <button class="btn-suave" id="deteccion-boton"></button>
      <p class="deteccion__nota" id="deteccion-nota"></p>
    </div>

    <p class="promesa">
      Solo se envían el título y la dirección de esta pestaña. Esta extensión no
      puede leer tus conversaciones: no tiene permiso sobre las páginas donde
      ocurren. <a href="#" id="ir-a-opciones">Ajustes</a>
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
