name: CI — Verificación del proyecto

# Se ejecuta en cada push y en cada Pull Request hacia la rama principal.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════
  #  CHECKS DE DOCUMENTACIÓN  (siempre activos)
  #
  #  Este job NO comprueba que el producto funcione. Comprueba que el proyecto
  #  esté bien documentado y honesto sobre su estado. Pasar este job en verde
  #  significa "la documentación está en orden", NO "el producto funciona".
  # ════════════════════════════════════════════════════════════════════════
  documentacion:
    name: Documentación y estado del proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Comprobar que existen los archivos obligatorios
        run: |
          echo "→ Comprobando archivos obligatorios..."
          obligatorios="README.md SYSTEM_VISION.md PROJECT_STATUS.md CLAUDE.md .claude/CLAUDE.md docs/ESTADOS_DEL_PROYECTO.md docs/ONBOARDING_NO_TECNICO.md docs/ANTES_DE_COMPARTIR.md docs/PROMPTS_BASE.md"
          falta=0
          for f in $obligatorios; do
            if [ -f "$f" ]; then
              echo "  ✅ $f"
            else
              echo "  ❌ FALTA: $f"
              falta=1
            fi
          done
          if [ "$falta" -eq 1 ]; then
            echo ""
            echo "ERROR: faltan archivos obligatorios del proyecto. Revisa la lista de arriba."
            exit 1
          fi
          echo "Todos los archivos obligatorios existen."

      - name: Avisar si README o PROJECT_STATUS siguen genéricos
        # Solo AVISA (no rompe el CI): un proyecto recién creado todavía tiene
        # plantillas sin rellenar, y eso es normal. Pero deja el aviso visible
        # para que nadie comparta el repo creyendo que está personalizado.
        run: |
          echo "→ Buscando contenido de plantilla sin rellenar..."
          aviso=0

          # Marcas típicas de texto sin rellenar.
          if grep -qE '\[Escribe aquí|\[rellenar|\[Claude rellena|\[fecha\]|\[nombre\]|\[Descripción\]|\[Tipo de usuario' README.md SYSTEM_VISION.md PROJECT_STATUS.md 2>/dev/null; then
            echo "  ⚠️  Hay marcas de plantilla sin rellenar (ej: [Escribe aquí], [rellenar], [fecha])."
            aviso=1
          fi

          # El título genérico del README de la plantilla.
          if head -n 1 README.md | grep -qE 'Claude Project Template'; then
            echo "  ⚠️  El README todavía tiene el título genérico de la plantilla."
            aviso=1
          fi

          if [ "$aviso" -eq 1 ]; then
            echo ""
            echo "::warning::El proyecto aún tiene documentación genérica sin personalizar."
            echo "Esto es NORMAL al empezar. Pero NO compartas el repo con terceros hasta"
            echo "personalizar README.md y PROJECT_STATUS.md (ver docs/ANTES_DE_COMPARTIR.md)."
          else
            echo "  ✅ No se detectó contenido de plantilla sin rellenar."
          fi

      - name: Recordatorio sobre el estado del CI
        run: |
          echo "════════════════════════════════════════════════════════════════"
          echo " Este job comprueba DOCUMENTACIÓN, no funcionamiento del producto."
          echo " Que el producto funcione lo comprueban los jobs 'calidad' e"
          echo " 'interfaz', que sí ejecutan tests reales sobre el código."
          echo "════════════════════════════════════════════════════════════════"

  # ════════════════════════════════════════════════════════════════════════
  #  TESTS DEL PRODUCTO
  #
  #  Este job SÍ comprueba que el código funciona: tipos, tests unitarios y
  #  que la aplicación se construye. Si está en verde, esas tres cosas son
  #  ciertas. No comprueba la experiencia de uso real — de eso se encarga el
  #  job 'interfaz'.
  # ════════════════════════════════════════════════════════════════════════
  calidad:
    name: Tipos, tests unitarios y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar tipos (TypeScript estricto)
        run: pnpm -r typecheck

      - name: Tests unitarios
        run: pnpm test

      - name: Build de producción
        run: pnpm build

  # ════════════════════════════════════════════════════════════════════════
  #  PRUEBA DE INTERFAZ
  #
  #  Arranca la aplicación Electron de verdad y recorre la vertical completa:
  #  crear tarea, cambiar estado, evento local por HTTP, notificación, y que
  #  los datos sigan ahí tras reiniciar. Necesita una pantalla virtual (xvfb)
  #  porque los runners de GitHub no tienen entorno gráfico.
  # ════════════════════════════════════════════════════════════════════════
  interfaz:
    name: Prueba de interfaz (Electron)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar dependencias de sistema de Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2

      - name: Ejecutar la prueba de interfaz
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Guardar el rastro si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-prueba-interfaz
          path: apps/desktop/test-results/
          retention-days: 7
